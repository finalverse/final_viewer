name: Inspect Upstream

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Report upstream changes for manual review
        run: |
          git fetch --no-tags https://github.com/secondlife/viewer.git development
          git log --oneline HEAD..FETCH_HEAD
          git diff --stat HEAD...FETCH_HEAD
# Upstream integration is reviewed locally. This workflow never merges or pushes.
